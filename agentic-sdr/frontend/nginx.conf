server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + SSE proxy. The variable + resolver make nginx re-resolve the
    # upstream on each request instead of caching the container IP at boot —
    # otherwise an api restart leaves nginx proxying to a dead address (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE requires buffering off and a long read timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
}
