# Full local stack: Kafka (KRaft), Postgres, API, 5 stage workers, scheduler, frontend.
#   docker compose --env-file ../.env up --build
# Runs without external API keys (APP_PROFILE=dev): infra, dashboard, upload and
# state machine all work; agents park leads with clear errors until keys exist.
name: agentic-sdr

x-backend-env: &backend-env
  DATABASE_URL: postgresql://sdr:sdr@postgres:5432/sdr
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  APP_PROFILE: ${APP_PROFILE:-dev}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
  SERPER_API_KEY: ${SERPER_API_KEY:-}
  HUNTER_API_KEY: ${HUNTER_API_KEY:-}
  APOLLO_API_KEY: ${APOLLO_API_KEY:-}
  GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
  GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
  GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
  GMAIL_SENDER_EMAIL: ${GMAIL_SENDER_EMAIL:-}

x-worker: &worker
  build: ../backend
  restart: unless-stopped
  environment: *backend-env
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdr
      POSTGRES_PASSWORD: sdr
      POSTGRES_DB: sdr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdr -d sdr"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # single-broker dev: EOS transactions need these RFs lowered from 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9094:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Topics are infrastructure: created explicitly, partition counts are a decision.
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        cd /opt/kafka/bin
        for t in sdr.cmd.research sdr.cmd.contact sdr.cmd.draft sdr.cmd.send sdr.cmd.classify; do
          ./kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$t" --partitions 6 --replication-factor 1
        done
        ./kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic sdr.evt.leads --partitions 6 --replication-factor 1 \
          --config retention.ms=604800000
        ./kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic sdr.dlq --partitions 3 --replication-factor 1 \
          --config retention.ms=1209600000
        echo "topics ready"

  api:
    <<: *worker
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  worker-research:
    <<: *worker
    command: ["python", "-m", "app.workers.main", "research"]

  worker-contact:
    <<: *worker
    command: ["python", "-m", "app.workers.main", "contact"]

  worker-draft:
    <<: *worker
    command: ["python", "-m", "app.workers.main", "draft"]

  worker-send:
    <<: *worker
    command: ["python", "-m", "app.workers.main", "send"]

  worker-classify:
    <<: *worker
    command: ["python", "-m", "app.workers.main", "classify"]

  scheduler:
    <<: *worker
    command: ["python", "-m", "app.scheduler"]

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  kafkadata:
