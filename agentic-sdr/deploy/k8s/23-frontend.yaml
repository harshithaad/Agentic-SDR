apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: agentic-sdr
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: agentic-sdr-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: agentic-sdr
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
