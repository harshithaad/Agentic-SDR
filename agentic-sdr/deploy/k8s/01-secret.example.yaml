# Copy to 01-secret.yaml, fill in values, and NEVER commit the filled copy.
#   kubectl apply -f 01-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: sdr-secrets
  namespace: agentic-sdr
type: Opaque
stringData:
  DATABASE_URL: postgresql://sdr:sdr@postgres:5432/sdr
  ANTHROPIC_API_KEY: ""
  FIRECRAWL_API_KEY: ""
  SERPER_API_KEY: ""
  HUNTER_API_KEY: ""
  APOLLO_API_KEY: ""
  GMAIL_CLIENT_ID: ""
  GMAIL_CLIENT_SECRET: ""
  GMAIL_REFRESH_TOKEN: ""
  GMAIL_SENDER_EMAIL: ""
