apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agentic-sdr
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: agentic-sdr-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sdr-config
            - secretRef:
                name: sdr-secrets
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agentic-sdr
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
