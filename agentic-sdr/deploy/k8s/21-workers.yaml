# Five stage workers from one image. Replicas scale independently per stage —
# partition count (6) is the parallelism ceiling per stage. Liveness is a
# heartbeat file the poll loop touches every second; if the loop wedges for
# 120 s the kubelet restarts the container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-research
  namespace: agentic-sdr
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker-research}
  template:
    metadata:
      labels: {app: worker-research, tier: worker}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: agentic-sdr-backend:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.main", "research"]
          envFrom:
            - configMapRef: {name: sdr-config}
            - secretRef: {name: sdr-secrets}
          ports:
            - containerPort: 9100
              name: metrics
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c",
                        "[ $(( $(date +%s) - $(cat /tmp/sdr-heartbeat 2>/dev/null || echo 0) )) -lt 120 ]"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 384Mi}
