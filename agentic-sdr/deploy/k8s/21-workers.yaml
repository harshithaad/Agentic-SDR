# Send stays at 1 replica by design: it serializes outbound mail, which keeps a
# soft rate cap on the Gmail account. Scale only with a rate limiter in front.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-send
  namespace: agentic-sdr
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker-send}
  template:
    metadata:
      labels: {app: worker-send, tier: worker}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: agentic-sdr-backend:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.main", "send"]
          envFrom:
            - configMapRef: {name: sdr-config}
            - secretRef: {name: sdr-secrets}
          ports:
            - {containerPort: 9100, name: metrics}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c",
                        "[ $(( $(date +%s) - $(cat /tmp/sdr-heartbeat 2>/dev/null || echo 0) )) -lt 120 ]"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 160Mi}
            limits: {memory: 320Mi}
